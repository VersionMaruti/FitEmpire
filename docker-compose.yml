version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: fitempire-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-fitempire}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fitempire-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
